---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hivemind-server-config
  namespace: hivemind
data:
  config.yaml: |
    # Database configuration
    database:
      # PostgreSQL configuration
      postgres:
        # Database server hostname (Kubernetes service name)
        host: postgres
        # Database server port
        port: 5432
        # Database name
        database: hivemind
        # Database user
        user: postgres
        # Database password (injected from secret)
        password: ${DB_PASSWORD}
        # SSL mode: "disable", "require", "verify-ca", "verify-full"
        sslmode: disable

    # gRPC server configuration
    grpc:
      # Host to bind to (use "0.0.0.0" to listen on all interfaces)
      host: 0.0.0.0
      # Port to listen on
      port: 4153
      # Metrics and health server port (standard Prometheus port)
      metrics_port: 9101

    # Authentication configuration
    auth:
      # JWT token configuration
      jwt:
        # Secret key for signing JWT tokens
        # Generate with: openssl rand -base64 32
        # IMPORTANT: Keep this secret! Anyone with this key can forge tokens.
        signing_key: ${JWT_SIGNING_KEY}

        # Token lifetime (duration string)
        # Examples: "15m", "1h", "24h", "168h" (7 days)
        # Recommended: 1h for production
        lifetime: 1h

      # Encryption key for OAuth refresh tokens (REQUIRED)
      # Generate with: openssl rand -base64 32
      # Must be exactly 32 bytes (256 bits) when base64-decoded
      # IMPORTANT: Keep this secret! Used to encrypt OAuth refresh tokens in database.
      encryption_key: ${OAUTH_ENCRYPTION_KEY}

      # Development bot token (DEVELOPMENT/TESTING ONLY)
      # WARNING: For production, use proper service tokens instead
      # Generate service tokens with: ./hivemind-server token create-service --name "discord-bot" --role bot
      dev_bot_token: ${DEV_BOT_TOKEN}

      # OAuth/OIDC provider configuration
      providers:
        # Discord OAuth
        - name: discord
          type: oidc
          issuer: https://discord.com
          # Discord application/client ID
          client_id: ${DISCORD_APPLICATION_ID}
          # Discord OAuth client secret
          client_secret: ${DISCORD_CLIENT_SECRET}
          # Scopes requested from Discord
          scopes:
            - openid
            - identify
            - email
          # Automatically provision new users on first login
          auto_provision: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-server
  namespace: hivemind
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hivemind-server
  template:
    metadata:
      labels:
        app: hivemind-server
    spec:
      containers:
      - name: server
        image: registry.local.rothwell.us/devilmonastery/hivemind-server@sha256:492ab52b6427e067f2c9ebc7da81e25105053fd72f9952fcfb95187878c9ecc9
        ports:
        - containerPort: 4153
          name: grpc
        - containerPort: 9101
          name: metrics
        env:
        - name: JWT_SIGNING_KEY
          valueFrom:
            secretKeyRef:
              name: hivemind-secrets
              key: jwt-signing-key
        - name: OAUTH_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              name: hivemind-secrets
              key: oauth-encryption-key
        - name: DEV_BOT_TOKEN
          valueFrom:
            secretKeyRef:
              name: hivemind-secrets
              key: dev-bot-token
              optional: true
        - name: DISCORD_APPLICATION_ID
          valueFrom:
            secretKeyRef:
              name: hivemind-secrets
              key: discord-application-id
        - name: DISCORD_CLIENT_SECRET
          valueFrom:
            secretKeyRef:
              name: hivemind-secrets
              key: discord-client-secret
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: db-password
        command:
        - /app/hivemind-server
        - --config
        - /etc/hivemind/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/hivemind
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        livenessProbe:
          tcpSocket:
            port: 4153
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 4153
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: hivemind-server-config
---
apiVersion: v1
kind: Service
metadata:
  name: hivemind-server
  namespace: hivemind
  labels:
    app: hivemind-server
spec:
  selector:
    app: hivemind-server
  ports:
  - port: 4153
    targetPort: 4153
    name: grpc
  - port: 9101
    targetPort: 9101
    name: metrics
  type: ClusterIP
