---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hivemind-web-config
  namespace: hivemind
data:
  config.yaml: |
    # HTTP server configuration
    server:
      # Host to bind to (use "0.0.0.0" to listen on all interfaces)
      host: 0.0.0.0
      # Port to listen on
      port: 8080
      # Metrics server port (standard Prometheus port)
      metrics_port: 9102

    # gRPC backend configuration
    grpc:
      # Address of the gRPC server (host:port)
      # For Kubernetes, use the service name: "hivemind-server:4153"
      address: hivemind-server:4153
      # TLS configuration for gRPC connection
      # The web server will automatically detect if TLS is needed:
      # - localhost connections use insecure (no TLS)
      # - Production hostnames use TLS with system certificates
      # No explicit configuration needed for most deployments

    # OAuth callback configuration
    oauth:
      # Redirect URI that OAuth providers redirect to after authentication
      # Must match the redirect URL configured in your OAuth provider settings
      # Production: "https://hivemind.dontberu.de/auth/callback"
      redirect_uri: https://hivemind.dontberu.de/auth/callback

    # Session management
    session:
      # Session secret key for encrypting session cookies
      # Generated with: openssl rand -base64 32
      # IMPORTANT: Keep this secret! Used to sign session cookies.
      secret: ${SESSION_SECRET}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hivemind-web
  namespace: hivemind
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hivemind-web
  template:
    metadata:
      labels:
        app: hivemind-web
    spec:
      containers:
      - name: web
        image: registry.local.rothwell.us/devilmonastery/hivemind-web
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9102
          name: metrics
        env:
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: hivemind-secrets
              key: session-secret
        command:
        - /app/hivemind-web
        - --config
        - /etc/hivemind/config.yaml
        volumeMounts:
        - name: config
          mountPath: /etc/hivemind
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "200m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: hivemind-web-config
---
apiVersion: v1
kind: Service
metadata:
  name: hivemind-web
  namespace: hivemind
  labels:
    app: hivemind-web
spec:
  selector:
    app: hivemind-web
  ports:
  - port: 80
    targetPort: 8080
    name: http
  - port: 9102
    targetPort: 9102
    name: metrics
  type: ClusterIP
